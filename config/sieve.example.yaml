# Sieve configuration reference. Copy to config/sieve.yaml and edit.
# Secrets (tokens, passwords, API keys) never go here: use .env or Settings in the web app (stored encrypted).
# Changes made in the web app are saved to <data_dir>/settings.override.yaml and win over this file.

data_dir: ./data
bind_host: "127.0.0.1"        # keep local; use 0.0.0.0 only behind a reverse proxy with HTTPS
port: 8080
# secret_key and ingest_token are generated on first run and stored in data/ (0600).
# Override with SIEVE_SECRET_KEY / SIEVE_INGEST_TOKEN. Print the token with: sieve token

filter:
  min_level: 5                # below this: suppressed with a reason, unless it continues an open incident
  allow_rule_ids: []          # always suppressed (with reason)
  allow_srcips: []            # e.g. your approved vulnerability scanner

grouping:
  window_minutes: 10          # extended by each new alert
  max_minutes: 120            # an incident never spans more than this

weights: { asset: 15, vuln: 10, intel: 10, chain: 20, novelty: 10, volume: 2 }   # research doc 6.3
bands: { critical: 80, high: 60, medium: 40 }
tripwire_threshold: 1.0

assets:                       # A term of the score; criticality: critical | normal | test
  - { agent_name: dc-01, criticality: critical, owner: IT }
  - { agent_name: web-01, criticality: critical, owner: Web team }

intel:
  blocklist_ips: []           # offline list
  abuseipdb_key_env: SIEVE_ABUSEIPDB_KEY   # when set, AbuseIPDB lookups replace the offline list
  abuseipdb_min_score: 50
  abuseipdb_daily_limit: 1000
  cache_minutes: 60

wazuh:                        # optional, read-only: investigation checks, "Show query", coverage map
  api_url: ""                 # https://wazuh.manager:55000
  indexer_url: ""             # https://wazuh.indexer:9200
  dashboard_url: ""           # https://wazuh.local
  username: wazuh-wui
  password_env: SIEVE_WAZUH_PASSWORD
  indexer_username: admin
  indexer_password_env: SIEVE_WAZUH_INDEXER_PASSWORD
  verify_tls: true
  pull_enabled: false        # true: read alerts from the indexer; nothing to install on the manager
  pull_interval_s: 15

llm:
  enabled: true
  min_band: medium            # only medium+ incidents reach a model
  calls_per_hour: 60          # shared by all providers
  mask_for_cloud: true        # IPs, users and hosts become tokens before any cloud call
  investigate_critical: true  # read-only checks for critical incidents (run even with AI off)
  providers:                  # fallback order; "no AI" is always the last resort
    - { name: local-ollama, kind: ollama, base_url: "http://ollama:11434", model: "llama3.1:8b", timeout_s: 90 }
    # - { name: free-cloud, kind: openai_compatible, base_url: "https://YOUR-PROVIDER/v1", model: "YOUR-MODEL",
    #     api_key_env: SIEVE_CLOUD_API_KEY, is_cloud: true, timeout_s: 30 }

notify:
  min_band: high              # tripwire hits always notify
  console: true
  public_url: "http://localhost:8080"
  telegram: { enabled: false, chat_id: "", token_env: SIEVE_TELEGRAM_TOKEN }
  slack: { enabled: false, channel: "", token_env: SIEVE_SLACK_TOKEN, webhook_env: SIEVE_SLACK_WEBHOOK }
  discord: { enabled: false, webhook_env: SIEVE_DISCORD_WEBHOOK }
  digest: { enabled: false, hour_utc: 7, version: manager }
  email: { enabled: false, host: "", port: 587, starttls: true, username: "", password_env: SIEVE_SMTP_PASSWORD, sender: "", to: [] }

sla: { critical: 15, high: 60, medium: 480, low: 1440, escalate: true }   # minutes to acknowledge
retention: { alerts_days: 90, llm_calls_days: 30 }                         # incidents and audit are kept
require_2fa_for_admins: false

webhooks: []   # - { name: soar, url: "https://…", secret_env: SIEVE_WEBHOOK_SECRET, min_band: high }
jira: { enabled: false, base_url: "", email: "", token_env: SIEVE_JIRA_TOKEN, project_key: "", issue_type: Task, min_band: high }
thehive: { enabled: false, base_url: "", token_env: SIEVE_THEHIVE_TOKEN, min_band: high }

shadow_mode: false            # triage and record, send nothing: validate Sieve on a new network first
allow_active_response: false  # Wazuh firewall-drop / disable-account; each run needs an admin's confirmation

# --- v0.3 ---
require_evidence_review: true        # High/Critical: open the evidence before closing
resummarise_growth: 1.5              # re-run the AI summary when an incident grows by 50%
floors:                              # single events that always reach at least this band (defaults shown)
  - { name: "High-importance Wazuh rule (level 12+)", min_level: 12, band: high }
  - { name: "Account created on a critical asset", techniques: [T1136, T1098], band: high, critical_asset_only: true }
  - { name: "Credential dumping", techniques: [T1003], band: high }
  - { name: "Ransomware-like impact", techniques: [T1486, T1490], band: critical }
routes: []        # - { name: web, hosts: ["web-*"], team: "Web team", telegram_chat_id: "-100…", assign_to: omar }
autoclose: { enabled: false, rules: [], max_band: medium, min_verdicts: 30, min_agreement: 0.95 }
profile: { organisation: "", industry: "", business_hours: "08:00-18:00", timezone: "UTC", normal_activity: [] }
teams: { enabled: false, webhook_env: SIEVE_TEAMS_WEBHOOK }
pagerduty: { enabled: false, routing_key_env: SIEVE_PAGERDUTY_KEY, min_band: critical }
oidc: { enabled: false, issuer: "", client_id: "", client_secret_env: SIEVE_OIDC_CLIENT_SECRET, admin_groups: [], analyst_groups: [], default_role: viewer }

# --- v0.4 ---
multi_tenant: false                 # MSSP mode: map agents to customers (Settings > Customers)
compliance: { nis2: true, dora: false, gdpr: true }
silence: { enabled: true, min_hours: 6, factor: 4 }      # silent-source incidents
pilot: { minutes_per_alert: 2.0, raw_notify_level: 7 }   # assumptions shown in the pilot report
chatops: { telegram_buttons: true, telegram_webhook_secret_env: SIEVE_TELEGRAM_WEBHOOK_SECRET, slack_buttons: true, slack_signing_secret_env: SIEVE_SLACK_SIGNING_SECRET, web_push: true }
vuln_min_severity: high             # V term: open critical/high vulnerabilities on the host

# --- v0.5 ---
risk: { enabled: true, threshold: 60, half_life_hours: 12, cooldown_hours: 24 }      # risk-based alerting
ueba: { enabled: true, min_logins: 20, rare_hour_share: 0.03, volume_sigma: 4, volume_min: 50 }
# High availability: set SIEVE_DATABASE_URL=postgresql://user:pass@host/sieve and run several `sieve worker`.
