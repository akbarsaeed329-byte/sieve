# Demo: no Wazuh, no AI needed.  SIEVE_CONFIG=config/demo.yaml sieve demo
data_dir: ./demo-data
bind_host: 127.0.0.1
port: 8080
assets:
  - { agent_name: web-01, criticality: critical }
  - { agent_name: dc-01, criticality: critical }
  - { agent_name: test-vm, criticality: test }
filter: { min_level: 4, allow_srcips: [198.51.100.7] }
intel: { blocklist_ips: [203.0.113.45] }
llm:
  enabled: false              # set true and start Ollama (make up-ai) to see AI summaries
  providers:
    - { name: local-ollama, kind: ollama, base_url: "http://localhost:11434", model: "llama3.1:8b", timeout_s: 90 }
notify: { min_band: high, console: true, public_url: http://localhost:8080 }
