# docker compose up -d                  -> Sieve only (rule-based; add a cloud model in Settings if you like)
# docker compose --profile ai up -d     -> Sieve + a local Ollama model server
# docker compose --profile demo up      -> load demo alerts into the same data volume
services:
  sieve:
    build: .
    image: ghcr.io/akbarsaeed329-byte/sieve:latest
    container_name: sieve
    ports:
      - "127.0.0.1:8080:8080"          # localhost only; put a TLS reverse proxy in front for remote access
    volumes:
      - sieve-data:/app/data
      - ./config:/app/config:ro
    environment:
      - SIEVE_CONFIG=/app/config/sieve.yaml
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [sieve-net]

  ollama:
    image: ollama/ollama:0.6.8
    container_name: ollama
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    expose: ["11434"]
    restart: unless-stopped
    networks: [sieve-net]

  sieve-demo:
    build: .
    profiles: ["demo"]
    command: ["sieve", "demo", "--no-serve"]
    volumes:
      - sieve-data:/app/data
      - ./config:/app/config:ro
    environment:
      - SIEVE_CONFIG=/app/config/sieve.yaml
    networks: [sieve-net]

# --- High availability: docker compose --profile ha up -d ---------------------------------------------
#   PostgreSQL + one web node (no worker) + two workers. Workers lease queue items with
#   FOR UPDATE SKIP LOCKED, so each alert is processed once; one leader runs periodic jobs.
  postgres:
    image: postgres:16.4
    profiles: ["ha"]
    environment: [POSTGRES_DB=sieve, POSTGRES_USER=sieve, "POSTGRES_PASSWORD=${SIEVE_PG_PASSWORD:?set SIEVE_PG_PASSWORD in .env}"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "sieve"], interval: 10s, retries: 5 }
    restart: unless-stopped
    networks: [sieve-net]
  sieve-web:
    build: .
    profiles: ["ha"]
    command: ["sieve", "serve", "--no-worker"]
    ports: ["127.0.0.1:8080:8080"]
    environment: [SIEVE_CONFIG=/app/config/sieve.yaml, "SIEVE_DATABASE_URL=postgresql://sieve:${SIEVE_PG_PASSWORD}@postgres/sieve"]
    volumes: [sieve-data:/app/data, ./config:/app/config:ro]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [sieve-net]
  sieve-worker:
    build: .
    profiles: ["ha"]
    command: ["sieve", "worker"]
    deploy: { replicas: 2 }
    environment: [SIEVE_CONFIG=/app/config/sieve.yaml, "SIEVE_DATABASE_URL=postgresql://sieve:${SIEVE_PG_PASSWORD}@postgres/sieve"]
    volumes: [sieve-data:/app/data, ./config:/app/config:ro]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [sieve-net]

volumes:
  sieve-data:
  ollama-models:
  pg-data:

networks:
  sieve-net:
