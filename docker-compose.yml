services:

  sieve:
    build: .
    container_name: sieve
    ports:
      - "8080:8080"
    volumes:
      - sieve-data:/app/data
      - ./config:/app/config:ro
    environment:
      - SIEVE_CONFIG=/app/config/sieve.yaml
      # Set these in a .env file (never commit secrets):
      # SIEVE_TELEGRAM_TOKEN=...
      # SIEVE_CLOUD_API_KEY=...
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - sieve-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - sieve-net

  # Demo profile: inject sample alerts without a real Wazuh
  sieve-demo:
    build: .
    container_name: sieve-demo
    profiles: ["demo"]
    command: sieve demo
    volumes:
      - sieve-data:/app/data
      - ./config:/app/config:ro
    environment:
      - SIEVE_CONFIG=/app/config/sieve.yaml
    depends_on:
      - sieve
    networks:
      - sieve-net

volumes:
  sieve-data:
  ollama-models:

networks:
  sieve-net:
    driver: bridge
