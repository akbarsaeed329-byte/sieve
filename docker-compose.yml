# docker compose up -d                  -> Sieve only (rule-based; add a cloud model in Settings if you like)
# docker compose --profile ai up -d     -> Sieve + a local Ollama model server
# docker compose --profile demo up      -> load demo alerts into the same data volume
services:
  sieve:
    build: .
    image: ghcr.io/sieve-project/sieve:0.1.0
    container_name: sieve
    ports:
      - "127.0.0.1:8080:8080"          # localhost only; put a TLS reverse proxy in front for remote access
    volumes:
      - sieve-data:/app/data
      - ./config:/app/config:ro
    environment:
      - SIEVE_CONFIG=/app/config/sieve.yaml
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [sieve-net]

  ollama:
    image: ollama/ollama:0.6.8
    container_name: ollama
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    expose: ["11434"]
    restart: unless-stopped
    networks: [sieve-net]

  sieve-demo:
    build: .
    profiles: ["demo"]
    command: ["sieve", "demo", "--no-serve"]
    volumes:
      - sieve-data:/app/data
      - ./config:/app/config:ro
    environment:
      - SIEVE_CONFIG=/app/config/sieve.yaml
    networks: [sieve-net]

volumes:
  sieve-data:
  ollama-models:

networks:
  sieve-net:
