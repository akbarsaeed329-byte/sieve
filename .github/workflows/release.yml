name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write          # keyless signing (Sigstore) and provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: sieve/web/package-lock.json }
      - name: Build web app
        run: cd sieve/web && npm ci --no-audit --no-fund && npm run build
      - name: Test before release
        run: pip install -e ".[dev]" && ruff check sieve tests benchmark && pytest -q
      - name: Build Python package
        run: pip install build && python -m build
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with: { path: ., format: cyclonedx-json, output-file: sieve-sbom.cdx.json }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }},ghcr.io/${{ github.repository }}:latest
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v1
        with: { subject-path: "dist/*" }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sieve-sbom.cdx.json
          generate_release_notes: true
