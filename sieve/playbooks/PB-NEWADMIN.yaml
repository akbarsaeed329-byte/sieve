id: PB-NEWADMIN
title: Unexpected privileged account created
mitre: [T1136, T1136.001, T1136.002]
steps:
  - id: PB-NEWADMIN-01
    title: Confirm whether account is authorised
    detail: "Check with the team whether {user} was created intentionally."
    requires_approval: false
  - id: PB-NEWADMIN-02
    title: Lock or remove the account if unauthorised
    detail: "Run: passwd -l {user}  then audit its group memberships."
    requires_approval: true
  - id: PB-NEWADMIN-03
    title: Review who created it
    detail: "Check audit logs for the parent process that ran useradd/net user."
    requires_approval: false
